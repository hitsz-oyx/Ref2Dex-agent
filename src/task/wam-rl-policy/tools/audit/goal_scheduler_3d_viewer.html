<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>手物状态与短目标 · 3D 调度审阅</title>
<style>
:root{font-family:Inter,"Noto Sans CJK SC",system-ui,sans-serif;color:#293b44;background:#eff2f1;font-size:14px}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dde4e1;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;letter-spacing:.02em;margin:0 0 5px}header small{color:#73817e}.scope{border:1px solid #d3dfda;border-radius:20px;padding:7px 13px;color:#5b756a}.workspace{max-width:1700px;margin:auto;padding:20px 24px}.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}select,button{font:inherit;background:#fff;border:1px solid #cfdbd5;border-radius:6px;padding:8px 11px;color:#344c43}button{cursor:pointer}button:hover{background:#e8efeb}#case{min-width:290px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px}.stage{position:relative;background:#fafbf9;border:1px solid #d9e2dc;border-radius:10px;overflow:hidden}#scene{display:block;width:100%;height:590px;cursor:grab;touch-action:none}.legend{position:absolute;left:18px;top:15px;display:flex;gap:17px;font-size:12px;background:#ffffffd9;border-radius:6px;padding:9px 11px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.caption{position:absolute;bottom:14px;left:18px;color:#789087;font-size:12px}.viewtools{display:flex;gap:7px;position:absolute;right:13px;bottom:12px}.viewtools button{font-size:12px;background:#ffffffd9}.sidebar{display:flex;flex-direction:column;gap:12px}.card{background:#fff;border:1px solid #d9e2dc;border-radius:9px;padding:17px}.eyebrow{font-size:11px;letter-spacing:.13em;color:#889991;margin-bottom:10px}.mode{font-size:22px;font-weight:650;color:#ba6a1d;margin-bottom:8px}.explain{line-height:1.7;color:#5b6e65;font-size:13px;min-height:44px}.metric{display:flex;justify-content:space-between;margin:12px 0;font-size:13px}.metric strong{font-size:15px;font-variant-numeric:tabular-nums}.bar{height:5px;background:#edf1ed;border-radius:10px;margin:12px 0}.bar i{display:block;height:100%;background:#409c8d;border-radius:10px}.subtle{font-size:12px;color:#85958d;line-height:1.65}.motion{font-size:12px;color:#768b81;line-height:1.8;border-top:1px solid #eef1ee;padding-top:10px;margin-top:8px}.timeline{background:#fff;border:1px solid #d9e2dc;border-radius:9px;margin-top:14px;padding:15px 18px}.playrow{display:flex;align-items:center;gap:10px}#frame{flex:1;min-width:80px;accent-color:#be7730}#time{font-variant-numeric:tabular-nums;min-width:96px;color:#6e8177;font-size:12px}#play{background:#2f675a;color:white;min-width:65px;border-color:#2f675a}#chart{width:100%;height:90px;display:block;margin-top:13px;cursor:crosshair}.foot{display:flex;justify-content:space-between;margin-top:12px;color:#7a8a83;font-size:12px;line-height:1.7;gap:20px}details{margin-top:10px;color:#74877b;font-size:12px}pre{white-space:pre-wrap;line-height:1.6}.warning{color:#a77135}#error{display:none;background:#fae5df;color:#8f3426;padding:20px;margin:20px}.toggles{display:flex;align-items:center;gap:12px;font-size:12px;color:#6e8177}input[type=checkbox]{accent-color:#608779}@media(max-width:1000px){.layout{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr}#scene{height:510px}}@media(max-width:650px){header{padding:16px}.workspace{padding:12px}.sidebar{display:block}.card{margin-bottom:10px}#scene{height:410px}.legend{gap:9px;font-size:10px}.scope{display:none}.foot{display:block}}
</style>
<header><div><h1>手物状态与短目标</h1><small>完整物体参考 → 当前交互证据 → 有界短目标</small></div><div class="scope">离线审阅 · 未运行 WAM 或新物理仿真</div></header>
<div id="error"></div>
<main class="workspace">
<div class="toolbar"><select id="case" aria-label="选择回放"></select><div class="toggles"><label><input id="legacy" type="checkbox">对比原几何调度</label><label><input id="path" type="checkbox" checked>完整参考路径</label><label><input id="hand" type="checkbox" checked>手部关键点</label></div></div>
<div class="layout"><section class="stage"><canvas id="scene" aria-label="可拖动旋转的手物3D回放"></canvas><div class="legend"><span><i class="dot" style="background:#479d90"></i>当前物体</span><span><i class="dot" style="background:#df994a"></i>短目标</span><span><i class="dot" style="background:#596d84"></i>实测手点</span><span><i class="dot" style="background:#78a2b6"></i>参考路径</span></div><div class="caption">拖动旋转 · 滚轮缩放 · Shift＋拖动平移</div><div class="viewtools"><button id="local">局部观察</button><button id="fit">全轨迹</button><button id="top">俯视</button></div></section>
<aside class="sidebar"><div class="card"><div class="eyebrow">当前调度决定</div><div id="mode" class="mode"></div><div id="reason" class="explain"></div><div class="metric"><span>短目标平移</span><strong id="translation"></strong></div><div class="metric"><span>短目标旋转</span><strong id="angle"></strong></div><div id="vector" class="motion"></div></div>
<div class="card"><div class="eyebrow">用于本次决定的观测</div><div id="interaction" class="explain"></div><div class="metric"><span>最近指尖到表面</span><strong id="gap"></strong></div><div class="metric"><span>近表面指尖数</span><strong id="fingers"></strong></div><div id="motion" class="subtle"></div><div class="bar"><i id="progress"></i></div><div id="phase" class="subtle"></div></div></aside></div>
<section class="timeline"><div class="playrow"><button id="play">播放</button><button id="back" title="上一个调度事件">上一步</button><button id="next" title="下一个调度事件">下一步</button><input type="range" id="frame" min="0" max="1" value="0" aria-label="回放时间"><span id="time"></span><select id="speed" aria-label="播放速度"><option>0.25</option><option selected>0.5</option><option>1</option><option>2</option></select></div><canvas id="chart" aria-label="短目标跨度随回放时间变化"></canvas><div class="subtle">橙线：当前调度目标跨度；紫线：原几何调度。单击曲线可定位，切换事件会停在模式或里程碑变化处。</div></section>
<div class="foot"><div id="source"></div><div class="warning">接近、候选接触和随动均为观测代理；不等同于抓稳或任务成功。</div></div><details><summary>查看参考索引与判定细节</summary><pre id="technical"></pre></details>
</main>
<script src="viewer-data.js"></script>
<script>
window.addEventListener('error',e=>{document.getElementById('error').style.display='block';document.getElementById('error').textContent='页面错误：'+e.message});
const DATA=window.GOAL_REPLAY.cases,$=id=>document.getElementById(id),selector=$('case'),slider=$('frame');
const colors={actual:'#479d90',goal:'#d79548',legacy:'#9b79bb',hand:'#566b82',path:'#8eafbf'};
const modeNames={PREPARE:'准备交互',TRACK:'沿参考推进',RECOVER:'寻找局部恢复目标',COMPLETE:'参考位姿已达标',TIMEOUT:'暂停：进度超时'};
const stateNames={UNKNOWN:'未提供手部观测',APPROACH:'手仍远离物体',PREPARE:'接触构型尚未形成',CONTACT_CANDIDATE:'指尖接近，控制能力尚不确定',COUPLED:'观测到持续手物随动',LOST:'原有随动关系已丢失'};
let ci=0,frame=0,playing=false,last=0,accum=0,az=.9,el=.5,zoom=1,focus=null,full=false,events=[];
const groups={};DATA.forEach((c,i)=>{const real=c.metadata.kind==='recorded_geometry_replay',key=real?'已有真实记录':'合成边界检查';if(!groups[key]){groups[key]=document.createElement('optgroup');groups[key].label=key;selector.appendChild(groups[key])}const o=document.createElement('option');o.value=i;o.textContent=c.name.replace(' / nominal',' · 原速度').replace(' / delayed_half_speed',' · 延迟半速').replace(' / 10_hz',' · 10Hz观测').replace('synthetic / ','');groups[key].appendChild(o)});
function center(p){return p.map(row=>row[3])}function transform(p,q){return q.map(v=>p.map(row=>row[0]*v[0]+row[1]*v[1]+row[2]*v[2]+row[3]))}
function subtract(a,b){return a.map((v,i)=>v-b[i])}function norm(v){return Math.hypot(...v)}function fmt(v,scale=1000,digits=1){return v===null||v===undefined?'未提供':(v*scale).toFixed(digits)}
function basis(){return{right:[Math.cos(az),-Math.sin(az),0],up:[-Math.sin(el)*Math.sin(az),-Math.sin(el)*Math.cos(az),Math.cos(el)],depth:[Math.cos(el)*Math.sin(az),Math.cos(el)*Math.cos(az),Math.sin(el)]}}
function dot(a,b){return a.reduce((v,x,i)=>v+x*b[i],0)}
function setup(canvas){const ratio=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);const ctx=canvas.getContext('2d');ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);return{ctx,w,h}}
function drawScene(){const c=DATA[ci],r=c.rows[frame],{ctx,w,h}=setup($('scene')),b=basis();
 const actual=transform(r.pose,c.surface),goal=transform(r.goal,c.surface),old=transform(r.legacy,c.surface),path=c.reference.map(center),cur=center(r.pose),target=center(r.goal);
 let midpoint=focus||cur.map((v,i)=>v+(r.hand?(r.hand[0][i]-v)*.2:0));let span=.34;
 if(full){const all=path.concat(actual,r.hand||[]);midpoint=[0,1,2].map(d=>(Math.min(...all.map(p=>p[d]))+Math.max(...all.map(p=>p[d])))/2);span=Math.max(.22,...[0,1,2].map(d=>Math.max(...all.map(p=>p[d]))-Math.min(...all.map(p=>p[d]))))*1.25}
 const scale=Math.min(w,h)/span*zoom,dist=span*4;
 function project(p){const d=subtract(p,midpoint),z=dot(d,b.depth),f=dist/Math.max(dist-z,dist*.3);return[w/2+dot(d,b.right)*scale*f,h/2-dot(d,b.up)*scale*f,z]}
 function line(a,z,color,width=1,dashed=false){const p=project(a),q=project(z);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dashed?[4,5]:[]);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();ctx.setLineDash([])}
 function dot3(p,color,radius){const q=project(p);ctx.fillStyle=color;ctx.beginPath();ctx.arc(q[0],q[1],radius,0,Math.PI*2);ctx.fill()}
 function label(p,text,color,dx=9,dy=-10){const q=project(p);ctx.font='12px system-ui';const tw=ctx.measureText(text).width;ctx.fillStyle='#ffffffdf';ctx.fillRect(q[0]+dx-4,q[1]+dy-12,tw+8,19);ctx.fillStyle=color;ctx.fillText(text,q[0]+dx,q[1]+dy+2)}
 const floor=Math.min(...actual.map(p=>p[2]),...transform(c.reference[0],c.surface).map(p=>p[2]))-.018;
 const step=.05,grid=Math.ceil(span/step);for(let i=-grid;i<=grid;i++){const dx=Math.round(midpoint[0]/step)*step,dy=Math.round(midpoint[1]/step)*step;line([dx-grid*step,dy+i*step,floor],[dx+grid*step,dy+i*step,floor],'#e3e8df');line([dx+i*step,dy-grid*step,floor],[dx+i*step,dy+grid*step,floor],'#e3e8df')}
 if($('path').checked){for(let i=1;i<path.length;i++)line(path[i-1],path[i],i<=r.ci?'#84b9a8':'#a7bfcc',i<=r.ci?2.5:1.4);const pending=c.milestones.find(i=>i>r.ci);if(pending!==undefined){dot3(path[pending],'#90aab8',4);label(path[pending],'待确认里程碑','#7b94a1',10,20)}}
 // Depth-order the CAD surface, rather than showing only 32 query samples.
 const dots=actual.map(p=>({p,color:colors.actual,size:2.1}));
 const stride=Math.max(1,Math.floor(goal.length/150));for(let i=0;i<goal.length;i+=stride)dots.push({p:goal[i],color:'#d7954888',size:1.8});
 if($('legacy').checked)for(let i=0;i<old.length;i+=stride)dots.push({p:old[i],color:'#9b79bb55',size:1.5});
 dots.sort((a,z)=>project(a.p)[2]-project(z.p)[2]);for(const p of dots)dot3(p.p,p.color,p.size);
 if($('hand').checked&&r.hand){for(let i=1;i<=5;i++){line(r.hand[0],r.hand[i],'#748394',3);line(r.hand[i],r.hand[i+5],'#596e84',3)}for(let i=0;i<11;i++)dot3(r.hand[i],i>=6?'#435d78':'#8597a6',i===0?5:3.5);label(r.hand[0],'实测手部','#52687e',10,-16)}
 function axes(p,size,alpha){const origin=center(p);['#bf6c66','#6e9e6c','#6791b2'].forEach((color,d)=>{const end=origin.map((v,i)=>v+p[i][d]*size);line(origin,end,color,alpha)})}axes(r.pose,.025,2);axes(r.goal,.025,1.3);
 line(cur,target,colors.goal,2.5);const a=project(cur),z=project(target),len=Math.hypot(z[0]-a[0],z[1]-a[1]);if(len>8){const ang=Math.atan2(z[1]-a[1],z[0]-a[0]);ctx.fillStyle=colors.goal;ctx.beginPath();ctx.moveTo(z[0],z[1]);ctx.lineTo(z[0]-9*Math.cos(ang-.45),z[1]-9*Math.sin(ang-.45));ctx.lineTo(z[0]-9*Math.cos(ang+.45),z[1]-9*Math.sin(ang+.45));ctx.fill()}
 label(target,'短目标 '+(norm(subtract(target,cur))*1000).toFixed(1)+' mm',colors.goal,14,-23);
 ctx.fillStyle='#809287';ctx.font='11px system-ui';ctx.fillText('网格 5 cm · 物体坐标轴 RGB = XYZ',18,h-38);
}
function explain(r){if(r.mode==='TIMEOUT')return'没有足够的有效进展，返回当前位姿并明确超时。';if(r.mode==='COMPLETE')return'末端位姿持续进入容差；这里只确认参考位姿，不确认任务功能。';if(r.mode==='RECOVER')return'保持已确认顺序，缩短目标；偏离过大时使用有界连接段。';if(r.interaction.state==='APPROACH')return'手还远，保留较小的运动意图，避免目标先跑到远处。';if(r.interaction.state==='CONTACT_CANDIDATE')return'已有近表面指尖，尚无充分控制证据；以较短目标建立交互。';if(r.interaction.state==='COUPLED')return'历史中手物运动较一致；按观测运动尺度和剩余参考选择目标。';return'沿已确认进度前视，目标跨度渐变，不随墙钟直接跳帧。'}
function render(){const c=DATA[ci],r=c.rows[frame],e=r.interaction,d=subtract(center(r.goal),center(r.pose));slider.value=frame;$('time').textContent=r.t.toFixed(2)+' / '+c.rows[c.rows.length-1].t.toFixed(2)+' s';$('mode').textContent=modeNames[r.mode]||r.mode;$('reason').textContent=explain(r);$('translation').textContent=(norm(d)*1000).toFixed(1)+' mm';$('angle').textContent=(r.angle*180/Math.PI).toFixed(1)+'°';$('vector').textContent='世界坐标 Δx '+fmt(d[0])+' · Δy '+fmt(d[1])+' · Δz '+fmt(d[2])+' mm';$('interaction').textContent=stateNames[e.state]||e.state;$('gap').textContent=e.fingertip_gap_m===null?'未提供':fmt(e.fingertip_gap_m)+' mm';$('fingers').textContent=e.near_fingers===null?'未提供':e.near_fingers+' / 5';$('motion').textContent='物体速度 '+fmt(e.object_speed_mps,100)+' cm/s；手相对物体速度 '+fmt(e.relative_hand_speed_mps,100)+' cm/s。';$('progress').style.width=(r.progress*100)+'%';$('phase').textContent='已确认参考进度 '+(r.progress*100).toFixed(1)+'% · 待确认的参考段仍保留';$('source').textContent=c.metadata.kind==='recorded_geometry_replay'?'已有 TRAIN 记录 · '+c.name+' · env '+c.metadata.environment+'。物体与手使用同一记录帧，未重新仿真。':'合成边界检查 · '+c.metadata.intervention+'。用于暴露逻辑边界，不计作机器人成功。';$('technical').textContent=JSON.stringify({confirmed_reference:r.ci,local_projection:r.pi,goal_reference:r.gi,goal_on_reference:r.onref,reason:r.reason,arrival_witness:r.witness,interaction:e,scope:'proxies and path geometry only'},null,2);drawScene();drawChart()}
function drawChart(){const c=DATA[ci],{ctx,w,h}=setup($('chart')),rows=c.rows,max=Math.max(.03,...rows.map(r=>Math.max(r.gap,r.legacygap||0)))*1.15;function plot(key,color){ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.beginPath();rows.forEach((r,i)=>{const x=i/(rows.length-1)*w,y=h-8-(r[key]||0)/max*(h-18);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke()}plot('legacygap','#ae95c2');plot('gap','#cd8c3f');const x=frame/(rows.length-1)*w;ctx.strokeStyle='#546b60';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();ctx.fillStyle='#8c9b91';ctx.font='10px system-ui';ctx.fillText('目标对应点跨度 · '+(max*1000).toFixed(0)+' mm',3,12)}
function choose(index,initial){ci=index;selector.value=ci;slider.max=DATA[ci].rows.length-1;frame=Math.min(initial||0,+slider.max);focus=null;full=false;zoom=1;events=DATA[ci].rows.map((r,i)=>i===0||r.mode!==DATA[ci].rows[i-1].mode||r.ci!==DATA[ci].rows[i-1].ci?i:-1).filter(i=>i>=0);render()}
selector.addEventListener('change',()=>choose(+selector.value,0));slider.addEventListener('input',()=>{frame=+slider.value;render()});['legacy','path','hand'].forEach(id=>$(id).addEventListener('change',render));
$('play').addEventListener('click',()=>{playing=!playing;last=0;$('play').textContent=playing?'暂停':'播放'});$('back').addEventListener('click',()=>{frame=events.filter(i=>i<frame).pop()||0;render()});$('next').addEventListener('click',()=>{const next=events.find(i=>i>frame);frame=next===undefined?+slider.max:next;render()});$('local').addEventListener('click',()=>{focus=null;full=false;zoom=1;render()});$('fit').addEventListener('click',()=>{focus=null;full=true;zoom=1;render()});$('top').addEventListener('click',()=>{el=Math.PI/2-.01;render()});
const canvas=$('scene');let pointer=null;canvas.addEventListener('pointerdown',e=>{pointer=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',()=>pointer=null);canvas.addEventListener('pointermove',e=>{if(!pointer)return;const dx=e.clientX-pointer[0],dy=e.clientY-pointer[1];if(e.shiftKey){if(!focus)focus=center(DATA[ci].rows[frame].pose);const b=basis();focus=focus.map((v,i)=>v-dx*.0005/zoom*b.right[i]+dy*.0005/zoom*b.up[i])}else{az+=dx*.008;el=Math.max(-.8,Math.min(1.55,el+dy*.008))}pointer=[e.clientX,e.clientY];render()});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.35,Math.min(5,zoom*Math.exp(-e.deltaY*.001)));render()},{passive:false});
$('chart').addEventListener('click',e=>{const box=$('chart').getBoundingClientRect();frame=Math.max(0,Math.min(+slider.max,Math.round((e.clientX-box.left)/box.width*(+slider.max))));render()});window.addEventListener('resize',render);window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){frame=Math.max(0,Math.min(+slider.max,frame+(e.key==='ArrowRight'?1:-1)));render();e.preventDefault()}});
function tick(ms){if(playing){const rows=DATA[ci].rows;if(last){accum+=(ms-last)/1000*(+$('speed').value);while(frame<rows.length-1&&accum>=rows[frame+1].t-rows[frame].t){accum-=rows[frame+1].t-rows[frame].t;frame++}render();if(frame>=rows.length-1){playing=false;$('play').textContent='播放'}}last=ms}requestAnimationFrame(tick)}
const params=new URLSearchParams(location.search),initialCase=params.has('case')?+params.get('case'):window.GOAL_REPLAY.default_case,initialFrame=params.has('frame')?+params.get('frame'):window.GOAL_REPLAY.default_frame;choose(initialCase,initialFrame);requestAnimationFrame(tick);window.goalViewer={select:(i,f)=>choose(i,f),seek:f=>{frame=f;render()},state:()=>({case:ci,frame,mode:DATA[ci].rows[frame].mode})};
</script>
</html>
